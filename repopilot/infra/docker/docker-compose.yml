version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: repopilot-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repopilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: repopilot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ChromaDB Vector Store
  chromadb:
    image: chromadb/chroma:latest
    container_name: repopilot-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: repopilot-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/repopilot
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4-turbo-preview}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      DEBUG: "True"
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
      - ./packages/shared:/packages/shared
      - ./packages/evals:/packages/evals
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: repopilot-worker
    depends_on:
      - db
      - redis
      - chromadb
      - api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/repopilot
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4-turbo-preview}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ./services/worker:/app
      - ./packages/shared:/packages/shared
      - ./packages/evals:/packages/evals
      - /var/run/docker.sock:/var/run/docker.sock
      - repo_workspaces:/tmp/repo_workspaces
    command: celery -A celery_app worker --loglevel=info --concurrency=2

  # Celery Beat (Scheduled Tasks)
  beat:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: repopilot-beat
    depends_on:
      - redis
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:postgres@db:5432/repopilot
    volumes:
      - ./services/worker:/app
    command: celery -A celery_app beat --loglevel=info

  # Next.js Frontend
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: repopilot-web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  chroma_data:
  repo_workspaces:

networks:
  default:
    name: repopilot-network
